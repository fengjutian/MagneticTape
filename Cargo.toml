[workspace]
resolver = "2"
members = [
    "crates/audio",
    "crates/core",
    "apps/desktop/src-tauri",
]
default-members = ["crates/core"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "MIT"
repository = "https://github.com/fengjutian/MagneticTape"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"


[profile.release]
codegen-units = 1
lto = "thin"
strip = true


