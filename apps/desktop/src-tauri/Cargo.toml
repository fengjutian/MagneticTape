[package]
name = "magnetic-tape-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[lib]
name = "magnetic_tape_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
magnetic-tape-audio = { path = "../../../crates/audio" }
magnetic-tape-core = { path = "../../../crates/core" }
serde.workspace = true
serde_json.workspace = true
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
keyring = "4.2"
tauri = { version = "2.9", features = ["protocol-asset"] }
trash = "5.2"

