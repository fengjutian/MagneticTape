[package]
name = "magnetic-tape-desktop"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"

[lib]
name = "magnetic_tape_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.4", features = [] }

[dependencies]
magnetic-tape = { path = "../../.." }
serde = { version = "1.0", features = ["derive"] }
tauri = { version = "2.9", features = [] }

