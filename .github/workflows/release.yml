name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - uses: Swatinem/rust-cache@v2

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Verify version matches tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME -replace '^v', ''
          $package = (Get-Content apps/desktop/package.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $tauri = (Get-Content apps/desktop/src-tauri/tauri.conf.json -Raw -Encoding UTF8 | ConvertFrom-Json).version
          $cargo = (Select-String -Path Cargo.toml -Pattern '^version\s*=\s*"([^"]+)"').Matches[0].Groups[1].Value
          if ($tag -ne $package -or $tag -ne $tauri -or $tag -ne $cargo) {
            throw "Version mismatch: tag=$tag package=$package tauri=$tauri cargo=$cargo"
          }

      - name: Build NSIS installer
        working-directory: apps/desktop
        run: npm run tauri build

      - name: Collect installer
        shell: pwsh
        run: |
          $installer = @(Get-ChildItem "target/release/bundle/nsis/*.exe" -File -ErrorAction Stop)
          if ($installer.Count -ne 1) {
            throw "Expected exactly one NSIS installer, found $($installer.Count)"
          }
          New-Item -ItemType Directory -Force -Path dist-installer | Out-Null
          Copy-Item -LiteralPath $installer[0].FullName dist-installer/
          $hash = (Get-FileHash -LiteralPath $installer[0].FullName -Algorithm SHA256).Hash.ToLower()
          "$hash  $($installer[0].Name)" | Set-Content -LiteralPath "dist-installer/$($installer[0].BaseName).sha256" -Encoding ascii
          Get-ChildItem dist-installer

      - uses: actions/upload-artifact@v4
        with:
          name: magnetic-tape-windows-installer
          path: dist-installer/*
          if-no-files-found: error

      - name: Attach installer to GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-installer/*
          generate_release_notes: true
